<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
<title id="t">How skills-gate works</title>
<desc id="d">On every prompt: you type a task, the prompt hook runs skills-gate suggest in about 79 milliseconds on the CPU, BM25 over skill names, descriptions and playbook headings ranks the bank and shows only matches above a bar, the agent loads one with skills-gate use or keeps it on for the project, and the load is recorded. Into the bank: a nightly catalog gathers the 20,000 skills skills.sh lists and validates each from its real SKILL.md; skills.sh, gh skill, git URLs and folders pass an install scan for pipe-to-shell, decoded payloads, reverse shells, credential reads, prompt injection, hidden unicode and binaries; high findings block and remote installs need the user's yes; outdated, diff and update keep them current. Every night tidy reads usage from Claude, Pi, OMP and Codex logs, holds skills that prompts, links or project manifests reference, switches off stale toggles after 14 days and moves skills unused for 120 days to cold storage. A session pays 389 tokens for the gate instead of 14,250 for listing all 148 skills. Banks sync across machines through a private git remote with a three-way merge per skill.</desc>

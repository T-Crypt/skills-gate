<text x="633" y="810" class="s" font-size="13.5" fill="#c9d6e3">16 known harnesses, a <tspan class="m" font-size="12.5" fill="#7ad4f2">.skills-gate.json</tspan> per project, and</text>
<text x="633" y="830" class="s" font-size="13.5" fill="#c9d6e3"><tspan class="m" font-size="12.5" fill="#c4a1ff">skills-gate mcp</tspan> for harnesses without a shell.</text>
<text x="40" y="878" class="m" font-size="11.5" fill="#5d728b">no model, no GPU, no daemon: one Python file and a SQLite registry at ~/.skills-gate</text>

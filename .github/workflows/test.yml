name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # ubuntu-latest is 26.04, which setup-python has no 3.9 build for; 24.04 has both
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
